name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

# Deliberately does not run lint or tests. This fires on release: published, by
# which point the release already exists — a failing check here could not stop it
# being issued, only leave it with no package attached. A tagged release is better
# off with a build than without one. Gating belongs on the tag push in node.yaml.
jobs:
  package:
    name: Package and attach to release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Needed to upload the built package as a release asset
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          # A release can be published against any tag, not just the default branch
          ref: ${{ github.event.release.tag_name }}
      - name: Use Node.js 26.x
        # This should match the version of Node.js you have defined in the manifest.json runtime field
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - name: Prepare Environment
        run: |
          corepack enable
      - name: Prepare module
        run: |
          yarn install
        env:
          CI: true
      - name: Build package
        # --dev is deliberate, and differs from the module store, which distributes
        # a production build. Assets here go to early testers, and an unminified
        # build keeps the stack traces in their bug reports readable.
        #
        # --prerelease bakes isPrerelease: true into the packaged manifest, so a
        # release ticked as a prerelease on GitHub produces a package Companion
        # also treats as one. Without the flag the manifest says isPrerelease: false.
        run: |
          if [ "$IS_PRERELEASE" = 'true' ]; then
            yarn package --dev --prerelease
          else
            yarn package --dev
          fi
        env:
          CI: true
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
      - name: Attach package to release
        # gh is preinstalled on the runner, so this needs no third party action.
        # --clobber lets the workflow be re-run against a release that already has
        # the asset attached.
        run: |
          gh release upload "${{ github.event.release.tag_name }}" ./*.tgz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
